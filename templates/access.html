<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReClip — Acceso</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1eb;
      --fg: #3a3a38;
      --accent: #e85d2a;
      --accent-hover: #d04e1f;
      --muted: #9c9889;
      --card: #fff;
      --card-border: #e2ded6;
      --error: #c43d3d;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .shell {
      width: 100%;
      max-width: 420px;
    }
    .brand {
      margin-bottom: 24px;
      text-align: center;
    }
    .brand h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 3.6rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand h1 em { font-style: italic; color: var(--accent); }
    .brand p {
      margin-top: 10px;
      font-size: 0.74rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.6;
    }
    .card {
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
    }
    h2 {
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .intro {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 18px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      background: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--fg);
      outline: none;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .btn:hover { background: var(--accent-hover); }
    .error-msg {
      color: var(--error);
      font-size: 0.78rem;
      margin-bottom: 12px;
    }
    .meta {
      margin-top: 18px;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <h1>Re<em>Clip</em></h1>
      <p>Acceso privado por código</p>
    </div>

    <div class="card">
      <h2>Entrar a la web</h2>
      <p class="intro">Introduce un código generado desde el panel de administración para habilitar el acceso a las descargas.</p>
      {% if error %}<p class="error-msg">{{ error }}</p>{% endif %}
      <form method="POST">
        <input type="text" name="code" placeholder="Código de acceso" maxlength="8" autocomplete="off" autofocus>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </div>

    <div class="meta">
      Si no tienes código, pídeselo al administrador.<br>
      El panel sigue disponible en /admin.
    </div>
  </div>
</body>
</html>
